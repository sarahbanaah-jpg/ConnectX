name: Build ConnectX APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9 || true
          chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: connectx-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Build Release APK (unsigned)
        run: |
          ./gradlew assembleRelease --stacktrace || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: connectx-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
